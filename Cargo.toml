[package]
name = "jjpr"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "jj-pr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.19", features = ["full"] }
git2 = "0.20"
octocrab = "0.48"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
which = "6.0"
lazy-regex = "3.4"

[dev-dependencies]
tempfile = "3.15"
